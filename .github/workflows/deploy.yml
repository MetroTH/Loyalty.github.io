name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_TENANT_SLUG: ${{ vars.VITE_TENANT_SLUG || 'default' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false

      - name: Build member app + admin app
        run: |
          base="/${GITHUB_REPOSITORY#*/}/"
          VITE_BASE="$base" pnpm --filter @loyalink/web build
          VITE_BASE="${base}admin/" pnpm --filter @loyalink/admin build
          mkdir -p site/admin
          cp -r apps/web/dist/* site/
          cp -r apps/admin/dist/* site/admin/
          # SPA fallback for client-side routing
          cp site/index.html site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
